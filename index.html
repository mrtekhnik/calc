<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e1217">
<title>Калькулятор</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--zoom:1;--fs:26px;--fsD:34px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--pad);color:var(--ink);font:16px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.hidden{display:none!important}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
header.top{flex:none;display:flex;align-items:center;gap:2px;min-height:46px;padding:env(safe-area-inset-top) 4px 0 14px;background:var(--bar);color:var(--barInk)}
header.top h1{flex:1;margin:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.ib:disabled{opacity:.3;cursor:default}
.ib:active:not(:disabled){background:rgba(128,128,128,.2)}
main{flex:1;display:flex;flex-direction:column;min-height:0}
/* лента расчётов */
#tape{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:6px 10px 8px;background:var(--bg);background-image:var(--img);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:default}
#lines{margin-top:auto}
.ln{text-align:right;font-size:calc(var(--fs)*var(--zoom));line-height:1.4;padding:2px 6px;border-radius:10px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.ln.act{background:var(--actBg)}
.ln.draft{font-size:calc(var(--fsD)*var(--zoom))}
.num{white-space:nowrap}
.d{padding:.12em 0;cursor:text}
.d.g{margin-left:.22em}
.op{cursor:pointer;padding:.12em .3em;margin:0 -.3em}
.op.sel{padding:0 .2em;margin:0 -.2em}
.sy{cursor:pointer}
.ref,.res.lk{color:var(--acc)}
.ref{cursor:pointer}
.res{cursor:pointer}
.eqs{}
.sel{background:var(--selBg);color:var(--selInk)!important;border-radius:.45em;padding:0 .18em}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--acc);vertical-align:-.17em;margin:0 -1px;position:relative;z-index:1}
.err{color:var(--err);font-size:.62em;white-space:nowrap}
.ref.bad{color:var(--err)}
.pv{display:block;color:var(--muted);font-size:.62em;line-height:1.2}
.pv.e{color:var(--err)}
.mut{color:var(--muted)}
/* клавиатура */
/* высота клавиатуры — настройка (доля высоты экрана); верхний ряд такой же высоты, как остальные */
#pad{flex:none;display:flex;flex-direction:column;background:var(--pad);height:calc(var(--padH,47)*1dvh);padding:1.5px 0 env(safe-area-inset-bottom)}
#pad.min{height:auto}
#pad.min .grids{display:none}
#pad.min .row{flex:none;height:calc(var(--padH,47)*1dvh/6)}
.row,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5px;background:var(--pad)}
.row{flex:1;min-height:40px;margin-bottom:1.5px}
.grids{flex:5;display:flex;flex-direction:column;min-height:0;touch-action:pan-y}
.grid{flex:1;min-height:0}
#gNum{grid-template-rows:repeat(5,1fr)}
#gSci{grid-template-rows:repeat(5,1fr)}
.k{display:flex;align-items:center;justify-content:center;min-height:0;font-size:25px;background:var(--key);color:var(--keyInk);user-select:none;-webkit-user-select:none}
.k.f{background:var(--fn);color:var(--fnInk)}
.k.eq{background:var(--eq);color:var(--eqInk);font-size:32px}
.k.sm{font-size:19px}
.k:active{filter:brightness(1.3)}
.k svg.i{width:26px;height:26px}
#gSci.off,#gNum.off{display:none}
/* широкий экран: история слева, клавиатура справа */
@media (min-width:720px) and (min-aspect-ratio:1/1){
  :root{--fs:24px;--fsD:30px}
  main{flex-direction:row}
  #tape{padding:10px 18px}
  #pad{width:min(400px,44vw);height:auto;border-left:1px solid var(--pad)}
  #pad.min{display:none}
  #gSci,#gNum{display:grid!important}
  .grids{flex:8}
  #gSci{flex:3;grid-template-rows:repeat(3,1fr);margin-bottom:1.5px}
  #gNum{flex:5}
  .narrowOnly{display:none!important}
  .k{font-size:21px}.k.eq{font-size:26px}.k.sm{font-size:16px}
}
@media not ((min-width:720px) and (min-aspect-ratio:1/1)){#kbBtn{display:none}}
/* окна */
#dlg{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
#dlg .box{background:var(--dlg);color:var(--dlgInk);width:min(560px,100%);max-height:88dvh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(14px + env(safe-area-inset-bottom))}
@media (min-width:720px){#dlg{align-items:center}#dlg .box{border-radius:16px}}
#dlg h2{margin:0 0 10px;font-size:18px}
#dlg .txt{font-size:15px;line-height:1.45;margin-bottom:12px}
#dlg .txt p{margin:0 0 8px}
#dlg .btns{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#dlg .btns button{padding:10px 18px;border-radius:10px;font-weight:600}
#dlg .btns .pri{background:var(--eq);color:var(--eqInk)}
#dlg .btns .dng{background:var(--err);color:#fff}
.mi{display:flex;align-items:center;width:100%;text-align:left;padding:13px 10px;font-size:16px;border-radius:10px}
.mi:active{background:rgba(128,128,128,.18)}
.mi.dng{color:var(--err)}
.foot{font-size:13px;opacity:.65;padding:8px 10px 0}
.opt{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid rgba(128,128,128,.2)}
.opt:last-child{border-bottom:0}
.opt .lb{font-size:15px}
.opt .lb small{display:block;opacity:.65;font-size:12.5px}
.seg{display:flex;border:1px solid rgba(128,128,128,.45);border-radius:10px;overflow:hidden;flex:none}
.seg button{padding:8px 12px;min-width:44px;font-size:15px}
.seg button.on{background:var(--eq);color:var(--eqInk)}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:40px;height:38px;border-radius:10px;border:1px solid rgba(128,128,128,.45);font-size:20px}
.step b{min-width:26px;text-align:center}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.th{border-radius:12px;overflow:hidden;border:2px solid transparent;text-align:left;display:flex;flex-direction:column}
.th.on{border-color:var(--eq)}
.th .scr{padding:8px 8px 6px;text-align:right;font-size:12px;line-height:1.5;font-variant-numeric:tabular-nums}
.th .kb{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;padding-top:1px}
.th .kb i{height:15px}
.th .nm{font-size:13px;padding:5px 8px;background:rgba(128,128,128,.15)}
#toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;background:rgba(20,20,20,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
#updBar{position:fixed;left:8px;right:8px;top:calc(50px + env(safe-area-inset-top));z-index:25;display:flex;align-items:center;gap:10px;background:var(--eq);color:var(--eqInk);padding:8px 8px 8px 14px;border-radius:12px;font-size:15px}
#updBar span{flex:1}
#updBar button{background:rgba(0,0,0,.25);color:inherit;padding:8px 14px;border-radius:9px;font-weight:600}
</style>
</head>
<body>
<header class="top">
  <h1>Калькулятор</h1>
  <button class="ib" id="undoBtn" title="Отменить (Ctrl+Z)"><svg class="i" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="ib" id="redoBtn" title="Повторить (Ctrl+Y)"><svg class="i" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <button class="ib" id="kbBtn" title="Показать или скрыть клавиатуру"><svg class="i" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button>
  <button class="ib" id="menuBtn" title="Меню"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
</header>
<div id="updBar" class="hidden"><span>Доступна новая версия</span><button id="updBtn">Обновить</button></div>
<main>
  <section id="tape"><div id="lines"></div></section>
  <section id="pad">
    <div class="row" id="topRow"></div>
    <div class="grids" id="grids">
      <div class="grid off" id="gSci"></div>
      <div class="grid" id="gNum"></div>
    </div>
  </section>
</main>
<div id="dlg" class="hidden"><div class="box"></div></div>
<div id="toast" class="hidden"></div>
<script src="core.js"></script>
<script>
'use strict';
const APP_VERSION='1.7',APP_DATE='21.11.2026';
const C=window.CalcCore;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Ключи хранилища с префиксом: на домене mrtekhnik.github.io хранилище общее для всех приложений
const LS={lines:'calc:lines',draft:'calc:draft',set:'calc:settings'};

/* ---------- темы ---------- */
const DARK={bg:'#161a23',img:'none',ink:'#d8dce0',muted:'#7d8590',acc:'#34a44c',actBg:'rgba(255,255,255,.06)',selBg:'#229f44',selInk:'#fff',pad:'#19202f',key:'#2e3748',keyInk:'#d8dce0',fn:'#262e3b',fnInk:'#d8dce0',eq:'#31a84a',eqInk:'#fff',bar:'#161a23',barInk:'#d8dce0',err:'#ff7b72',dlg:'#222a37',dlgInk:'#d8dce0'};
const LIGHT={bg:'#ffffff',img:'none',ink:'#1f2328',muted:'#8c959f',acc:'#1a7f37',actBg:'rgba(0,0,0,.055)',selBg:'',selInk:'#fff',pad:'#d5dae0',key:'#ffffff',keyInk:'#1f2328',fn:'#eef1f4',fnInk:'#1f2328',eq:'#1a7f37',eqInk:'#fff',bar:'#f3f5f7',barInk:'#1f2328',err:'#cf222e',dlg:'#ffffff',dlgInk:'#1f2328'};
const T=(name,dark,o)=>{const t=Object.assign({},dark?DARK:LIGHT,o||{},{name,dark});if(o&&o.acc&&!o.selBg)t.selBg=t.acc;if(!t.selBg)t.selBg=t.acc;return t;};
const THEMES={
  dark:T('Графит',1),
  light:T('Светлая',0),
  auto:T('Как в системе',1),
  black:T('Чёрная',1,{bg:'#000',pad:'#000',key:'#161616',fn:'#0c0c0c',bar:'#000',acc:'#4da3ff',eq:'#2f81f7',dlg:'#141414'}),
  navy:T('Тёмно-синяя',1,{bg:'#0d1b2a',pad:'#081320',key:'#1b2d45',fn:'#132338',bar:'#081320',acc:'#6cb6ff',eq:'#2f80ed',muted:'#7891ad',dlg:'#142437'}),
  amber:T('Янтарная',1,{bg:'#191919',pad:'#0f0f0f',key:'#2a2a2a',fn:'#202020',bar:'#0f0f0f',acc:'#ffb454',eq:'#ff9500',eqInk:'#1a1a1a',selInk:'#1a1a1a',dlg:'#222'}),
  rose:T('Тёмно-розовая',1,{bg:'#1c1820',pad:'#130f16',key:'#2c2530',fn:'#221c26',bar:'#130f16',acc:'#ff7aa8',eq:'#e64980',dlg:'#261f2a'}),
  sunset:T('Закат',1,{bg:'#3a1c71',img:'linear-gradient(165deg,#3a1c71 0%,#8f3f72 60%,#c8654f 100%)',ink:'#fff',muted:'#e8c9d6',acc:'#ffe08a',actBg:'rgba(255,255,255,.13)',selInk:'#2a163f',pad:'#1f1030',key:'#341c4d',fn:'#2a163f',bar:'#2a163f',eq:'#ff7a59',dlg:'#2c1a40'}),
  forest:T('Хвоя',1,{bg:'#12372a',img:'linear-gradient(165deg,#0b2a22 0%,#1d5c45 100%)',muted:'#8fb3a3',acc:'#a5e16b',selInk:'#08180f',pad:'#08180f',key:'#173b2c',fn:'#112d21',bar:'#0b2a22',eq:'#43a047',dlg:'#143024'}),
  ocean:T('Бирюзовая',0,{bg:'#f2fbfc',pad:'#c4dfe3',key:'#fff',fn:'#e2f3f5',acc:'#0b8793',eq:'#0e9aa7',bar:'#e2f3f5'}),
  violet:T('Фиолетовая',0,{bg:'#f6f5ff',acc:'#5b4bd6',pad:'#221a5e',key:'#3a2f95',keyInk:'#fff',fn:'#2f2680',fnInk:'#e3e0ff',eq:'#ffb703',eqInk:'#1d1d1d',bar:'#efeeff'}),
  simple:T('Простая',0,{pad:'#e0e0e0',key:'#fafafa',fn:'#f0f0f0',acc:'#e8590c',eq:'#f76707'}),
  classic:T('Классическая',0,{bg:'#e6e2d3',ink:'#2b2b2b',muted:'#77725f',pad:'#bdb7a4',key:'#f4f1e8',fn:'#d6d0bd',acc:'#b23a2e',eq:'#c0392b',bar:'#d6d0bd',dlg:'#f4f1e8'}),
  material:T('Материал',0,{bg:'#eceff1',pad:'#1c262b',key:'#37474f',keyInk:'#eceff1',fn:'#2c3a40',fnInk:'#cfd8dc',acc:'#00897b',eq:'#00bfa5',eqInk:'#00241f',bar:'#e3e8eb'}),
};
const mqDark=matchMedia('(prefers-color-scheme: dark)');
function curTheme(){if(S.theme==='auto')return mqDark.matches?THEMES.dark:THEMES.light;return THEMES[S.theme]||THEMES.dark;}
function applyTheme(){
  const t=curTheme(),st=document.documentElement.style;
  for(const k in DARK)st.setProperty('--'+k,t[k]);
  $('meta[name=theme-color]').content=t.bar;
}
mqDark.addEventListener('change',()=>{if(S.theme==='auto')applyTheme();});

/* ---------- состояние ---------- */
const DEF={theme:'dark',dec:4,sep:',',group:true,keep:true,vib:false,size:'m',kb:47,padHidden:false,hlIn:true};
let S=Object.assign({},DEF);
let lines=[];          // {id,pos,expr,upd,del,tmp}
let draft=[];          // атомы строки ввода
let ed={id:'draft',atoms:[],cur:0,sel:null,hl:false}; // что сейчас правится; hl — число у курсора выделено (ввод дописывает в него)
let results=new Map();
let justCommitted=null; // после «=» следующее действие продолжает расчёт от результата
let undoSt=[],redoSt=[],session=0;
let sciPage=false;

const now=()=>Date.now();
const newId=()=>now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>o?JSON.parse(JSON.stringify(o)):null;
const byId=id=>lines.find(l=>l.id===id&&!l.del);
const vis=()=>lines.filter(l=>!l.del).sort((a,b)=>a.pos-b.pos);
const fmtV=v=>C.fmt(v,{dec:S.dec,sep:S.sep,group:S.group});
const fmtC=v=>C.fmtCopy(v,{dec:S.dec,sep:S.sep});

function load(){
  try{Object.assign(S,JSON.parse(localStorage.getItem(LS.set)||'{}'));}catch(e){}
  if(S.keep){
    try{lines=JSON.parse(localStorage.getItem(LS.lines)||'[]');}catch(e){lines=[];}
    try{draft=JSON.parse(localStorage.getItem(LS.draft)||'[]');}catch(e){draft=[];}
  }
  if(!Array.isArray(lines))lines=[];if(!Array.isArray(draft))draft=[];
  // удалённые строки хранятся с пометкой (для будущей синхронизации и корзины), старше 30 дней — убираются
  const lim=now()-30*864e5;
  lines=lines.filter(l=>l&&Array.isArray(l.expr)&&!(l.del&&l.upd<lim)&&!l.tmp);
  ed={id:'draft',atoms:draft,cur:draft.length,sel:null};
}
let saveT=0;
function saveNow(){
  clearTimeout(saveT);saveT=0;
  try{
    localStorage.setItem(LS.set,JSON.stringify(S));
    if(S.keep){localStorage.setItem(LS.lines,JSON.stringify(lines.filter(l=>!l.tmp||l.expr.length)));localStorage.setItem(LS.draft,JSON.stringify(draft));}
    else{localStorage.removeItem(LS.lines);localStorage.removeItem(LS.draft);}
  }catch(e){toast('Не удалось сохранить историю');}
}
const scheduleSave=()=>{clearTimeout(saveT);saveT=setTimeout(saveNow,400);};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveNow();});
addEventListener('pagehide',saveNow);

/* ---------- отмена ---------- */
// Действие отмены — список строк в состоянии «до»; null — строки не было.
function pushUndo(items,kind){undoSt.push({items,kind:kind||'',session});if(undoSt.length>200)undoSt.shift();redoSt=[];}
function setLine(id,snap){
  const i=lines.findIndex(l=>l.id===id);
  if(!snap){if(i>=0)lines.splice(i,1);return;}
  if(i>=0)lines[i]=snap;else lines.push(snap);
}
function swapStack(from,to){
  leaveEdit();
  const a=from.pop();if(!a)return;
  to.push({items:a.items.map(it=>({id:it.id,before:clone(lines.find(l=>l.id===it.id))})),kind:a.kind,session:-1});
  for(const it of a.items)setLine(it.id,clone(it.before));
  session++;changed();
}
const undo=()=>{if(!undoSt.length)return toast('Нечего отменять');swapStack(undoSt,redoSt);};
const redo=()=>{if(!redoSt.length)return toast('Нечего повторять');swapStack(redoSt,undoSt);};

/* ---------- правка ---------- */
function setEd(st){
  const changedAtoms=JSON.stringify(st.atoms)!==JSON.stringify(ed.atoms);
  if(ed.id==='draft'){draft=st.atoms;}
  else if(changedAtoms){
    const l=byId(ed.id);
    if(l){
      const top=undoSt[undoSt.length-1];
      if(!(top&&top.kind==='edit'&&top.session===session&&top.items[0].id===l.id))
        pushUndo([{id:l.id,before:l.tmp?null:clone(l)}],'edit');
      l.expr=st.atoms;l.upd=now();if(l.tmp&&st.atoms.length)delete l.tmp;
    }
  }
  const hl=!!(ed.hl&&!st.sel&&C.runAround(st.atoms,st.cur)&&C.isNumCh(st.atoms[st.cur-1]));
  ed={id:ed.id,atoms:st.atoms,cur:st.cur,sel:st.sel||null,hl,dirty:!!(ed.dirty||(changedAtoms&&ed.id!=='draft'))};
  if(changedAtoms)justCommitted=null;
  changed();
}
function leaveEdit(){
  if(ed.id==='draft')return;
  const l=lines.find(x=>x.id===ed.id);
  if(l&&!l.del&&!l.expr.length){
    if(l.tmp)lines.splice(lines.indexOf(l),1);
    else{l.del=1;l.upd=now();}
  }
  session++;
  ed={id:'draft',atoms:draft,cur:draft.length,sel:null};
}
function activate(id,cur,sel,hl){
  if(id!==ed.id){
    leaveEdit();
    if(id==='draft')ed={id:'draft',atoms:draft,cur:draft.length,sel:null};
    else{const l=byId(id);if(!l)return;ed={id,atoms:l.expr,cur:l.expr.length,sel:null};}
  }
  if(cur!==undefined)ed.cur=cur;
  ed.sel=sel||null;ed.hl=!!hl;
  justCommitted=null;
  render();
  const el=document.querySelector(`.ln[data-id="${id}"]`);if(el)el.scrollIntoView({block:'nearest'});
}
function commit(){
  if(!draft.length)return;
  const L=vis();
  const l={id:newId(),pos:(L.length?L[L.length-1].pos:0)+1,expr:draft,upd:now(),del:0};
  lines.push(l);pushUndo([{id:l.id,before:null}],'add');
  draft=[];ed={id:'draft',atoms:draft,cur:0,sel:null};justCommitted=l.id;
  changed();scrollBottom();
}
function key(k){
  if(S.vib&&navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
  if(k==='='){
    if(ed.id==='draft'){commit();return;}
    if(!ed.dirty){
      const piece=selectedPiece();
      if(piece){leaveEdit();toDraft(piece);return;}
    }
    leaveEdit();changed();scrollBottom();return;
  }
  if(k==='C'){if(ed.atoms.length)setEd({atoms:[],cur:0,sel:null});return;}
  if(k==='back'){setEd(C.backspace(ed));return;}
  if(k==='del'){setEd(C.delForward(ed));return;}
  if(k==='left'||k==='right'||k==='home'||k==='end'){
    let c=ed.sel?(k==='left'?ed.sel[0]:ed.sel[1]):ed.cur;
    if(!ed.sel||k==='home'||k==='end'){
      if(k==='left')c=Math.max(0,c-1);else if(k==='right')c=Math.min(ed.atoms.length,c+1);
      else if(k==='home')c=0;else c=ed.atoms.length;
    }
    ed.cur=c;ed.sel=null;ed.hl=false;render();return;
  }
  if(C.isRef(k)&&ed.id!=='draft'&&C.dependsOn(lines,k.r,ed.id)){
    toast(k.r===ed.id?'Строка не может ссылаться на себя':'Нельзя: эта строка сама зависит от редактируемой — получится цикл');return;}
  let st=ed;
  if(ed.id==='draft'&&!draft.length&&justCommitted&&byId(justCommitted)&&(C.BIN.has(k)||C.POST.has(k)))
    st={atoms:[{r:justCommitted}],cur:1,sel:null}; // продолжение от предыдущего результата
  setEd(C.insert(st,k));
}
// Что выделено в строке истории: число (атомы) или ссылка
function selectedPiece(){
  if(ed.hl){const r=C.runAround(ed.atoms,ed.cur);if(r)return ed.atoms.slice(r[0],r[1]);}
  if(ed.sel&&ed.sel[1]-ed.sel[0]===1&&C.isRef(ed.atoms[ed.sel[0]]))return [ed.atoms[ed.sel[0]]];
  if(ed.sel&&ed.atoms.slice(ed.sel[0],ed.sel[1]).every(C.isNumCh))return ed.atoms.slice(ed.sel[0],ed.sel[1]);
  return null;
}
// Перенести число или ссылку в конец строки ввода (после числа или скобки ставится «×»)
function toDraft(piece){
  activate('draft');

  if(piece.length===1&&C.isRef(piece[0]))st=C.insert(st,piece[0]);
  else{if(C.endsOperand(st.atoms[st.cur-1]))st.atoms.push('×');st.atoms.push(...piece);st.cur=st.atoms.length;}

}
const pieceText=piece=>piece.map(a=>a==='.'?S.sep:a).join('');
function insertRef(id){

function deleteLine(id){

  const r=results.get(id),v=r&&!r.err?r.v:undefined;

function insertAbove(id){

async function clearAll(){

/* ---------- вывод ---------- */
const SYM={'-':'−','lg2':'log₂','abs':'abs','√':'√','∛':'∛'};
function exprHTML(expr,active,sel,cur,hl){
  let h='',i=0;
  if(active&&hl&&!sel){const r=C.runAround(expr,cur);if(r){sel=r;}} // выделенное число — без курсора
  const caret=()=>'<span class="caret"></span>';
  const inSel=j=>sel&&j>=sel[0]&&j<sel[1];
  while(i<expr.length){
    if(active&&!sel&&cur===i)h+=caret();
    const a=expr[i];
    if(C.isNumCh(a)){
      let j=i;while(j<expr.length&&C.isNumCh(expr[j]))j++;
      const run=expr.slice(i,j),dot=run.indexOf('.'),intLen=dot<0?run.length:dot;
      const whole=sel&&sel[0]===i&&sel[1]===j;
      h+=`<span class="num${whole?' sel':''}">`;
      for(let k=i;k<j;k++){
        if(active&&!sel&&cur===k&&k>i)h+=caret();
        const p=k-i,ch=expr[k];
        const g=S.group&&p>0&&p<intLen&&(intLen-p)%3===0;
        h+=`<span class="d${g?' g':''}${!whole&&inSel(k)?' sel':''}" data-i="${k}">${ch==='.'?S.sep:ch}</span>`;
      }
      h+='</span>';i=j;continue;
    }
    if(C.isRef(a)){
      const r=results.get(a.r);
      const t=r&&!r.err?fmtV(r.v):'?';
      h+=`<span class="ref${r&&!r.err?'':' bad'}${inSel(i)?' sel':''}" data-i="${i}" data-r="${esc(a.r)}">${t}</span>`;
    }else if(C.BIN.has(a)){
      h+=` <span class="op${inSel(i)?' sel':''}" data-i="${i}">${a==='-'?'−':a}</span> `;
    }else{
      h+=`<span class="sy${inSel(i)?' sel':''}" data-i="${i}">${SYM[a]||a}</span>`;
    }
    i++;
  }
  if(active&&!sel&&cur>=expr.length)h+=caret();
  return h;
}
function lineHTML(l,refd){
  const act=ed.id===l.id,r=results.get(l.id);
  const expr=act?ed.atoms:l.expr;
  let h=exprHTML(expr,act,act?ed.sel:null,act?ed.cur:0,act&&ed.hl);
  if(!expr.length)h+='<span class="mut">пустая строка</span>';
  if(r){
    if(r.err)h+=` <span class="eqs">=</span> <span class="err">${esc(r.err)}</span>`;
    else h+=` <span class="eqs">=</span> <span class="res${refd?' lk':''}" data-r="${esc(l.id)}">${fmtV(r.v)}</span>`;
  }
  return h;
}
function draftHTML(){
  const act=ed.id==='draft';
  if(!draft.length)return (act?'<span class="caret"></span>':'')+'<span class="mut">0</span>';
  let sel=act?ed.sel:null;
  // подсветка того, что вводится сейчас: число целиком или последний знак (когда курсор в конце строки)
  if(act&&!sel&&!ed.hl&&S.hlIn&&ed.cur===draft.length){
    const j=draft.length-1;
    sel=C.isNumCh(draft[j])?C.runAt(draft,j):[j,j+1];
  }
  let h=exprHTML(draft,act,sel,act?ed.cur:0,act&&ed.hl);
  const r=C.evaluate(draft,id=>{const x=results.get(id);if(!x||x.err)throw new C.CalcError('Ошибка в связанной строке');return x.v;});
  const single=draft.every(a=>C.isNumCh(a))||(draft.length===1&&C.isRef(draft[0]));
  if(r&&!r.err&&!single)h+=`<span class="pv">= ${fmtV(r.v)}</span>`;
  else if(r&&r.err&&r.code!=='incomplete')h+=`<span class="pv e">${esc(r.err)}</span>`;
  return h;
}
const nodes=new Map();
function render(){
  const box=$('#lines'),L=vis();
  const refd=new Set();
  for(const l of L)for(const id of C.refsOf(l.expr))refd.add(id);
  for(const id of C.refsOf(draft))refd.add(id);
  const keep=new Set();
  let prev=null;
  for(const l of L){
    keep.add(l.id);
    let n=nodes.get(l.id);
    if(!n){n=document.createElement('div');n.className='ln';n.dataset.id=l.id;nodes.set(l.id,n);n._h='';}
    const h=lineHTML(l,refd.has(l.id));
    if(n._h!==h){n.innerHTML=h;n._h=h;}
    n.classList.toggle('act',ed.id===l.id);
    const want=prev?prev.nextSibling:box.firstChild;
    if(want!==n)box.insertBefore(n,want);
    prev=n;
  }
  let d=nodes.get('draft');
  if(!d){d=document.createElement('div');d.className='ln draft';d.dataset.id='draft';nodes.set('draft',d);}
  d.innerHTML=draftHTML();d.classList.toggle('act',false);
  const want=prev?prev.nextSibling:box.firstChild;
  if(want!==d)box.insertBefore(d,want);
  for(const [id,n] of nodes)if(id!=='draft'&&!keep.has(id)){n.remove();nodes.delete(id);}
  $('#undoBtn').disabled=!undoSt.length;$('#redoBtn').disabled=!redoSt.length;
}
function changed(){results=C.computeAll(lines);render();scheduleSave();if(ed.id==='draft')scrollBottom();} // строка ввода с предпросмотром всегда видна над клавиатурой
function rerenderAll(){for(const n of nodes.values())n._h='';render();}
const scrollBottom=()=>{const t=$('#tape');t.scrollTop=t.scrollHeight;};
new ResizeObserver(()=>{if(ed.id==='draft')scrollBottom();}).observe($('#tape'));

/* ---------- нажатия в ленте ---------- */
$('#tape').addEventListener('click',e=>{
  const ln=e.target.closest('.ln');
  if(!ln){activate('draft');return;}
  const id=ln.dataset.id;
  const res=e.target.closest('.res');
  if(res){insertRef(res.dataset.r);return;}
  const at=e.target.closest('[data-i]');
  if(!at){activate(id);return;}
  const i=+at.dataset.i;
  const atoms=id==='draft'?draft:(byId(id)||{expr:[]}).expr;
  const wasActive=ed.id===id;
  if(at.classList.contains('d')){
    const run=C.runAt(atoms,i);
    const inRun=wasActive&&!ed.sel&&ed.cur>=run[0]&&ed.cur<=run[1];
    if(inRun){ // второе нажатие по числу — курсор между цифрами
      const r=at.getBoundingClientRect();
      activate(id,e.clientX<r.left+r.width/2?i:i+1,null,false);
    }else activate(id,run[1],null,true); // первое — число выделено, ввод дописывает в конец
  }else{
    if(wasActive&&ed.sel&&ed.sel[0]===i&&ed.sel[1]===i+1)activate(id,i+1,null);
    else activate(id,i+1,[i,i+1]);

});
// долгое нажатие (на ПК — правая кнопка мыши)
$('#tape').addEventListener('contextmenu',e=>{
  e.preventDefault();

// Убрать ссылки: вместо ссылки в строке остаётся число (её значение сейчас), связь с исходной строкой пропадает.
// at — номер атома одной ссылки; null — все ссылки строки
function unlinkIn(expr,at){
  const out=[];let n=0,bad=0;
  expr.forEach((a,i)=>{
    if(C.isRef(a)&&(at===null||at===i)){
      const v=refVal(a.r);
      if(v===undefined){bad++;out.push(a);}else{out.push(...C.numberAtoms(v));n++;}
    }else out.push(a);
  });
  return {expr:out,n,bad};
}
function unlinkLine(id,at){
  const src=id==='draft'?draft:(byId(id)||{}).expr;if(!src)return;
  const u=unlinkIn(src,at);
  if(!u.n){toast(u.bad?'У ссылки нет значения — сначала исправьте исходную строку':'Ссылок нет');return;}
  if(id==='draft'){draft=u.expr;if(ed.id==='draft')ed={id:'draft',atoms:draft,cur:draft.length,sel:null,hl:false};changed();}
  else if(ed.id===id){setEd({atoms:u.expr,cur:u.expr.length,sel:null});}
  else{const l=byId(id);pushUndo([{id,before:clone(l)}],'unlink');l.expr=u.expr;l.upd=now();changed();}
  toast(u.n===1?'Ссылка убрана — осталось число':`Ссылок убрано: ${u.n} — остались числа`);
}
function unlinkDependents(id){
  const deps=C.directDependents(lines,id).filter(x=>x.id!==id);
  const v=refVal(id);
  if(!deps.length&&!C.refsOf(draft).includes(id))return;
  if(v===undefined){toast('В строке нет результата');return;}
  if(deps.some(d=>d.id===ed.id))leaveEdit();
  pushUndo(deps.map(d=>({id:d.id,before:clone(d)})),'unlink');
  for(const d of deps){d.expr=C.freezeRef(d.expr,id,v);d.upd=now();}
  if(C.refsOf(draft).includes(id)){draft=C.freezeRef(draft,id,v);if(ed.id==='draft')ed={id:'draft',atoms:draft,cur:draft.length,sel:null,hl:false};}
  changed();
  toast(`Отвязано строк: ${deps.length}`);
}
async function lineMenu(id,refAt,numAt){
  const src=id==='draft'?draft:(byId(id)||{expr:[]}).expr;
  let piece=null;
  if(numAt!==null&&numAt!==undefined){const r=C.runAt(src,numAt);if(r)piece=src.slice(r[0],r[1]);}
  const isRefAt=refAt!==null&&refAt!==undefined;
  if(isRefAt)piece=[src[refAt]];
  const pv=piece&&!C.isRef(piece[0])?pieceText(piece):(isRefAt&&refVal(piece[0].r)!==undefined?fmtC(refVal(piece[0].r)):null);
  // пункты для нажатого числа или ссылки — первыми
  const one=[];
  if(pv!==null)one.push({k:'pc',l:`Копировать число ${pv}`});
  if(piece&&id!=='draft')one.push({k:'pd',l:isRefAt?'Вставить в строку ввода (ссылкой)':'Вставить число в строку ввода'});
  if(isRefAt)one.push({k:'un1',l:'Убрать эту ссылку (оставить число)'});
  const pieceAct=k=>{if(k==='pc'){copyText(pv,'Скопировано: '+pv);return true;}if(k==='pd'){if(ed.id===id)leaveEdit();toDraft(piece);return true;}return false;};
  if(id==='draft'){
    const many=C.refsOf(draft).length>1?[{k:'unA',l:'Убрать все ссылки в строке'}]:[];
    const k=await choose('Строка ввода',[...one,...many,{k:'paste',l:'Вставить из буфера'},{k:'copy',l:'Копировать результат'},{k:'clr',l:'Очистить строку'}]);
    if(pieceAct(k))return;
    if(k==='un1')unlinkLine('draft',refAt);
    else if(k==='unA')unlinkLine('draft',null);
    else if(k==='paste')pasteFromClipboard();
    else if(k==='copy')copyResult('draft');
    else if(k==='clr'){activate('draft');key('C');}
    return;
  }
  const l=byId(id);if(!l)return;
  const r=results.get(id);
  const items=[...one];
  const nRefs=C.refsOf(l.expr).length;
  if(nRefs>1||(nRefs===1&&!one.length))items.push({k:'unA',l:nRefs>1?`Убрать все ссылки в строке (${nRefs})`:'Убрать ссылку (оставить число)'});
  const nDeps=C.directDependents(lines,id).filter(x=>x.id!==id).length;
  if(nDeps)items.push({k:'unD',l:`Отвязать строки, которые ссылаются сюда (${nDeps})`});
  if(r&&!r.err)items.push({k:'ins',l:'Вставить результат в строку ввода'},{k:'cr',l:'Копировать результат'});
  items.push({k:'cl',l:'Копировать строку'},{k:'edit',l:'Править строку'},{k:'above',l:'Вставить строку выше'},{k:'del',l:'Удалить строку',c:'dng'});
  const k=await choose(C.exprText(l.expr,refVal,optsF())+(r&&!r.err?' = '+fmtV(r.v):''),items);
  if(pieceAct(k))return;
  if(k==='un1')unlinkLine(id,refAt);
  else if(k==='unA')unlinkLine(id,null);
  else if(k==='unD')unlinkDependents(id);
  else if(k==='ins'){activate('draft');insertRef(id);}
  else if(k==='cr')copyResult(id);
  else if(k==='cl')copyText(lineText(l));
  else if(k==='edit')activate(id);
  else if(k==='above')insertAbove(id);
  else if(k==='del'){
    const deps=C.directDependents(lines,id).length;
    if(deps&&await confirmBox('Удалить строку?',`На её результат ссылаются строки: ${deps}. В них вместо ссылки останется число ${r&&!r.err?fmtV(r.v):''}.`,'Удалить',1)!=='ok')return;
    deleteLine(id);
  }
}
const optsF=()=>({dec:S.dec,sep:S.sep,group:S.group});

function lineText(l){const r=results.get(l.id);return C.exprText(l.expr,refVal,optsF())+' = '+(r?(r.err?r.err:fmtV(r.v).replace(/ /g,' ')):'');}

/* ---------- буфер обмена ---------- */
function copyText(t,msg){
  const done=()=>toast(msg||'Скопировано');
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t)&&done());
  else if(fallbackCopy(t))done();
}
function fallbackCopy(t){try{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();if(!ok)toast('Не удалось скопировать');return ok;}catch(e){toast('Не удалось скопировать');return false;}}
function copyResult(id){
  let v;
  if(id==='draft'){
    if(draft.length){const r=C.evaluate(draft,x=>{const q=results.get(x);if(!q||q.err)throw new C.CalcError('x');return q.v;});if(r&&!r.err)v=r.v;}
    else{const L=vis();for(let i=L.length-1;i>=0&&v===undefined;i--){const r=results.get(L[i].id);if(r&&!r.err)v=r.v;}}
  }else{const r=results.get(id);if(r&&!r.err)v=r.v;}
  if(v===undefined){toast('Нет результата');return;}
  const t=fmtC(v);copyText(t,'Скопировано: '+t);
}
function pasteAtoms(text){
  const atoms=C.parseText(text);if(!atoms.length){toast('В буфере нет чисел');return;}
  let st={atoms:ed.atoms.slice(),cur:ed.cur,sel:ed.sel};
  if(st.sel){st.atoms.splice(st.sel[0],st.sel[1]-st.sel[0]);st.cur=st.sel[0];}
  st.atoms.splice(st.cur,0,...atoms);st.cur+=atoms.length;st.sel=null;
  setEd(st);
}
async function pasteFromClipboard(){

}
let swiped=false,sx=0,sy=0;
$('#grids').addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;swiped=false;});
$('#grids').addEventListener('pointerup',e=>{
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){swiped=true;setPage(!sciPage);setTimeout(()=>swiped=false,50);}
});
$('#pad').addEventListener('mousedown',e=>e.preventDefault()); // кнопки не забирают фокус (Enter на ПК не нажмёт кнопку)
$('#pad').addEventListener('click',e=>{
  const b=e.target.closest('[data-k]');if(!b||swiped)return;
  const k=b.dataset.k;
  if(k==='tog')togglePad();
  else if(k==='123')setPage(false);
  else key(k);
});

/* ---------- клавиатура ПК ---------- */
const KEYMAP={'*':'×','/':'÷','x':'×','X':'×',':':'÷',',':'.','.':'.','+':'+','-':'-','^':'^','(':'(',')':')','%':'%','!':'!','p':'π','P':'π','r':'√','R':'√'};
document.addEventListener('keydown',e=>{
  const dlgOpen=!$('#dlg').classList.contains('hidden');
  if(dlgOpen){if(e.key==='Escape'){e.preventDefault();closeDlg(null);}return;}
  const c=e.ctrlKey||e.metaKey;
  if(c&&!e.altKey){
    const k=e.key.toLowerCase();
    if(k==='z'||k==='я'){e.preventDefault();e.shiftKey?redo():undo();}
    else if(k==='y'||k==='н'){e.preventDefault();redo();}
    else if(k==='c'||k==='с'){if(String(getSelection()))return;e.preventDefault();copyResult(ed.id);}
    return;
  }
  if(e.altKey)return;
  let k=null;
  const nd=/^Numpad(\d)$/.exec(e.code); // цифровой блок работает и при выключенном NumLock
  if(nd)k=nd[1];
  else if(/^[0-9]$/.test(e.key))k=e.key;
  else if(e.code==='NumpadDecimal')k='.';
  else if(KEYMAP[e.key])k=KEYMAP[e.key];
  else if(e.key==='Enter'||e.key==='='){
    if(e.shiftKey&&ed.id!=='draft'){const id=ed.id;e.preventDefault();activate('draft');insertRef(id);return;}
    k='=';
  }
  else if(e.key==='Backspace')k='back';
  else if(e.key==='Delete')k='del';
  else if(e.key==='ArrowLeft')k='left';
  else if(e.key==='ArrowRight')k='right';
  else if(e.key==='Home')k='home';
  else if(e.key==='End')k='end';
  else if(e.key==='Escape'){
    e.preventDefault();
    if(ed.id!=='draft'){leaveEdit();changed();}else key('C');
    return;
  }
  else if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    e.preventDefault();
    const L=vis();if(!L.length)return;
    const i=ed.id==='draft'?L.length:L.findIndex(l=>l.id===ed.id);
    const j=e.key==='ArrowUp'?Math.max(0,i-1):i+1;
    if(j>=L.length)activate('draft');else activate(L[j].id);
    return;
  }
  if(k!==null){e.preventDefault();key(k);}
});

/* ---------- окна ---------- */
let dlgResolve=null;
function openDlg(html){const b=$('#dlg .box');b.innerHTML=html;$('#dlg').classList.remove('hidden');b.scrollTop=0;return new Promise(r=>dlgResolve=r);}
function closeDlg(v){$('#dlg').classList.add('hidden');const r=dlgResolve;dlgResolve=null;if(r)r(v);}
$('#dlg').addEventListener('click',e=>{
  if(e.target.id==='dlg'){closeDlg(null);return;}
  const b=e.target.closest('[data-r]');if(b&&b.closest('#dlg .box')&&!b.closest('.live'))closeDlg(b.dataset.r);
});
function choose(title,items,foot){
  return openDlg(`<h2>${esc(title)}</h2>`+items.map(it=>`<button class="mi ${it.c||''}" data-r="${it.k}">${esc(it.l)}</button>`).join('')+(foot?`<div class="foot">${foot}</div>`:''));
}
function confirmBox(title,text,ok,danger){
  return openDlg(`<h2>${esc(title)}</h2><div class="txt">${esc(text)}</div><div class="btns"><button data-r="no">Отмена</button><button class="${danger?'dng':'pri'}" data-r="ok">${esc(ok||'OK')}</button></div>`);
}
function alertBox(title,html){return openDlg(`<h2>${esc(title)}</h2><div class="txt">${html}</div><div class="btns"><button class="pri" data-r="ok">Понятно</button></div>`);}
let toastT=0;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.add('hidden'),2300);}

/* ---------- меню ---------- */
$('#menuBtn').onclick=async()=>{
  const k=await choose('Меню',[
    {k:'th',l:'Темы'},{k:'st',l:'Настройки'},{k:'cp',l:'Копировать всю историю'},{k:'clr',l:'Очистить историю',c:'dng'},
    {k:'help',l:'Как пользоваться'},{k:'up',l:'Проверить обновления'}],`Версия ${APP_VERSION} от ${APP_DATE}`);
  if(k==='th')themesDlg();
  else if(k==='st')settingsDlg();
  else if(k==='cp'){const L=vis();if(!L.length)return toast('История пуста');copyText(L.map(lineText).join('\n'),`Скопировано строк: ${L.length}`);}
  else if(k==='clr')clearAll();
  else if(k==='help')helpDlg();
  else if(k==='up')checkUpdate();
};
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;$('#kbBtn').onclick=togglePad;

function themeCard(id){
  const t=id==='auto'?THEMES.dark:THEMES[id],l=id==='auto'?THEMES.light:null;
  const scr=(x)=>`<div class="scr" style="background:${x.bg};background-image:${x.img};color:${x.ink}">123 + 456 = <span style="color:${x.acc}">579</span><br><span style="color:${x.acc}">579</span> × 2 = 1 158</div>`;
  const kb=(x)=>{let h='';for(let r=0;r<3;r++)for(let c=0;c<4;c++)h+=`<i style="background:${c===3?(r===2?x.eq:x.fn):(r===0?x.fn:x.key)}"></i>`;return `<div class="kb" style="background:${x.pad}">${h}</div>`;};
  const body=l?scr(l)+kb(t):scr(t)+kb(t); // «Как в системе»: сверху светлая, снизу тёмная
  return `<button class="th${S.theme===id?' on':''}" data-t="${id}">${body}<div class="nm">${esc(THEMES[id].name)}</div></button>`;
}
function themesDlg(){
  openDlg(`<h2>Темы</h2><div class="themes live">${Object.keys(THEMES).map(themeCard).join('')}</div><div class="btns"><button class="pri" data-r="ok">Готово</button></div>`);
  $('#dlg .themes').onclick=e=>{
    const b=e.target.closest('[data-t]');if(!b)return;
    S.theme=b.dataset.t;applyTheme();scheduleSave();
    document.querySelectorAll('#dlg .th').forEach(x=>x.classList.toggle('on',x===b));
  };
}
function settingsDlg(){
  const seg=(name,opts,val)=>`<div class="seg" data-s="${name}">${opts.map(([v,l])=>`<button data-v="${v}" class="${String(val)===String(v)?'on':''}">${l}</button>`).join('')}</div>`;
  openDlg(`<h2>Настройки</h2><div class="live">
    <div class="opt"><div class="lb">Знаков после запятой<small>Не больше этого числа; у чисел меньше 1 видно минимум 4 значащие цифры</small></div>
      <div class="step"><button data-st="-">−</button><b id="decV">${S.dec}</b><button data-st="+">+</button></div></div>
    <div class="opt"><div class="lb">Десятичный разделитель</div>${seg('sep',[[',','запятая'],['.','точка']],S.sep)}</div>
    <div class="opt"><div class="lb">Пробел между тысячами<small>1 234 567</small></div>${seg('group',[['true','да'],['false','нет']],S.group)}</div>
    <div class="opt"><div class="lb">Размер цифр</div>${seg('size',[['s','мелкий'],['m','средний'],['l','крупный']],S.size)}</div>
    <div class="opt"><div class="lb">Высота клавиатуры<small>На широком экране ПК клавиатура всегда во всю высоту</small></div>${seg('kb',[[40,'ниже'],[47,'обычная'],[54,'выше'],[60,'макс.']],S.kb)}
      <div class="step" style="margin-left:auto"><small style="opacity:.65">точно:</small><button data-kst="-">−</button><b id="kbV">${S.kb}%</b><button data-kst="+">+</button></div></div>
    <div class="opt"><div class="lb">Подсвечивать вводимое<small>В строке ввода выделяется число или знак, который вы сейчас набираете</small></div>${seg('hlIn',[['true','да'],['false','нет']],S.hlIn)}</div>
    <div class="opt"><div class="lb">Вибрация при нажатии</div>${seg('vib',[['true','да'],['false','нет']],S.vib)}</div>
    <div class="opt"><div class="lb">Сохранять историю<small>Если выключить, история хранится только до закрытия приложения</small></div>${seg('keep',[['true','да'],['false','нет']],S.keep)}</div>
  </div><div class="btns"><button class="pri" data-r="ok">Готово</button></div>`);
  const box=$('#dlg .live');
  box.onclick=async e=>{
    const st=e.target.closest('[data-st]');
    if(st){S.dec=Math.max(0,Math.min(10,S.dec+(st.dataset.st==='+'?1:-1)));$('#decV').textContent=S.dec;applySettings();return;}
    const ks=e.target.closest('[data-kst]');
    if(ks){ // точная высота клавиатуры: 30–70 % высоты экрана, шаг 1
      S.kb=Math.max(30,Math.min(70,(S.kb||47)+(ks.dataset.kst==='+'?1:-1)));
      syncKb();applySettings();return;}
    const b=e.target.closest('.seg button');if(!b)return;
    const name=b.parentElement.dataset.s;let v=b.dataset.v;
    if(v==='true')v=true;else if(v==='false')v=false;else if(name==='kb')v=+v;
    if(name==='keep'&&v===false&&S.keep){
      closeDlg(null);
      if(await confirmBox('Не сохранять историю?','Сохранённая история будет удалена с этого устройства при следующем сохранении. Текущие строки останутся до закрытия приложения.','Выключить',1)!=='ok')return settingsDlg();
      S.keep=false;applySettings();return settingsDlg();
    }
    S[name]=v;
    if(name==='kb'){syncKb();applySettings();return;}
    b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    applySettings();
  };
}
function applyDims(){
  const st=document.documentElement.style;
  st.setProperty('--zoom',{s:.85,m:1,l:1.18}[S.size]||1);
  st.setProperty('--padH',S.kb||47);
}
function syncKb(){ // число и кнопки высоты клавиатуры в окне настроек — согласованно
  const v=$('#kbV');if(v)v.textContent=S.kb+'%';
  document.querySelectorAll('#dlg .seg[data-s="kb"] button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.kb));
}
function applySettings(){
  applyDims();
  buildPad();rerenderAll();saveNow();
}
function helpDlg(){
  alertBox('Как пользоваться',`
  <p><b>Правка в истории.</b> Нажмите на число в любой строке — оно выделится: цифры дописываются в конец, ⌫ стирает по одному знаку. Нажмите на выделенное число ещё раз — появится курсор между цифрами для точной правки. Так же правятся действия (+ − × ÷). Все строки, которые ссылаются на исправленную, пересчитываются сразу. «=» заканчивает правку.</p>
  <p><b>Перенос числа.</b> Нажмите на число в истории (оно выделится) и сразу «=» — число перенесётся в строку ввода. Если число уже исправили, «=» просто заканчивает правку. Долгое нажатие на число — «Копировать число» и «Вставить число в строку ввода».</p>
  <p><b>Связанные значения.</b> Нажмите на результат любой строки — он вставится в строку ввода как ссылка (выделен цветом). Если исходную строку исправить, связанная пересчитается. Если после «=» сразу нажать действие, расчёт продолжится от результата.</p>
  <p><b>Убрать ссылку:</b> долгое нажатие на зелёное число — «Убрать эту ссылку»: вместо неё останется обычное число, и строка перестанет зависеть от исходной. В меню строки можно убрать все её ссылки или отвязать все строки, которые ссылаются на неё.</p>
  <p><b>Долгое нажатие</b> на строку (на ПК — правая кнопка мыши): копировать, вставить строку выше, удалить. При удалении строки в зависимых строках вместо ссылки остаётся число.</p>
  <p><b>Проценты:</b> 100 + 10% = 110; 100 − 10% = 90; 200 × 15% = 30; 200 ÷ 50% = 400; просто 10% = 0,1.</p>
  <p><b>Функции:</b> проведите по клавиатуре влево или вправо, вернуться — так же или кнопкой «123». Кнопка ⌄ сворачивает клавиатуру, высота клавиатуры — в настройках.</p>
  <p><b>Клавиатура ПК:</b> цифры и цифровой блок, + − * / ^ ( ) %, Enter — «=», Backspace/Delete, Esc — выход из правки или очистка ввода, ← → — курсор, ↑ ↓ — переход по строкам, Shift+Enter — вставить результат выбранной строки в ввод, Ctrl+C — копировать результат, Ctrl+V — вставить, Ctrl+Z / Ctrl+Y — отмена и повтор, p — π, r — √.</p>`);
}

/* ---------- запуск ---------- */
load();applyTheme();applyDims();
buildPad();changed();scrollBottom();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

/* ---------- обновление приложения (как в «Размерах»: новая версия ждёт нажатия «Обновить») ---------- */
let swReg=null;
const showUpd=()=>$('#updBar').classList.remove('hidden');
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  const hadCtrl=!!navigator.serviceWorker.controller;let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtrl||reloading)return;reloading=true;location.reload();});
  navigator.serviceWorker.register('sw.js').then(reg=>{swReg=reg;
    if(reg.waiting&&navigator.serviceWorker.controller)showUpd();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;if(!w)return;
      w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpd();});});
  }).catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&swReg)swReg.update().catch(()=>{});});
}
async function checkUpdate(){
  if(!swReg){toast('Обновления доступны только в установленной версии');return;}
  if(swReg.waiting){showUpd();return;}
  toast('Проверка…');try{await swReg.update();}catch(e){toast('Нет связи с сервером');return;}
  setTimeout(()=>{if(swReg.waiting||swReg.installing)showUpd();else toast(`Установлена последняя версия (${APP_VERSION})`);},1500);}
$('#updBtn').onclick=()=>{leaveEdit();saveNow();const w=swReg&&swReg.waiting;if(w)w.postMessage('SKIP_WAITING');else location.reload();};
</script>
